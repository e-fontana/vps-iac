# Modelo de CI para o repositório da API. Copie para .github/workflows/deploy.yml lá.
#
# A cada push na main: constrói a imagem linux/arm64, publica no GHCR com a tag do commit
# e atualiza a tag em gitops/manifests/api/kustomization.yaml no repositório GitOps.
# O ArgoCD vê o commit e aplica.
#
# Precisa de um secret GITOPS_TOKEN neste repositório: token com permissão de escrita
# (Contents: read and write) só no repositório de infra.
# As versões das actions abaixo vêm da minha memória; confira se há versões mais novas.
name: build-and-deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/api
  GITOPS_REPO: e-fontana/vpn-iac

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo
      - name: Atualiza a imagem no kustomization
        working-directory: gitops-repo/gitops/manifests/api
        run: kustomize edit set image api-image=${IMAGE}:${GITHUB_SHA}
      - name: Commit e push
        working-directory: gitops-repo
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add gitops/manifests/api/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(api): ${GITHUB_SHA::7}"
          git push
