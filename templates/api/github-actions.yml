# Modelo de build e deploy para o repositório da API. Copie para .github/workflows/deploy.yml lá.
# Troque "api" nos nomes das imagens (IMAGE, MIGRATE_IMAGE) e o caminho gitops/manifests/api pelo nome da sua aplicação.
# Se a aplicação não tem migrações, apague a imagem de migração, o MIGRATE_IMAGE e o argumento migrate-image=.
#
# Build e deploy da API.
#
# O build roda a cada push na main, no disparo manual (workflow_dispatch) e quando uma release é publicada:
# constrói duas imagens linux/arm64 (a VPS é ARM) e as publica no GHCR com a tag do commit.
# O deploy roda só no disparo manual ou na release (não no push): ele
# atualiza as duas tags em gitops/manifests/api/kustomization.yaml no repositório de infra (vpn-iac):
#   ghcr.io/<dono>/api          a aplicação (Dockerfile, alvo padrão)
#   ghcr.io/<dono>/api-migrate  o Job de migração do Prisma (Dockerfile, alvo "migrate"), usado no hook PreSync
# O ArgoCD vê o commit, roda as migrações e só então atualiza a API.
#
# Precisa do secret GITOPS_TOKEN: token fine-grained com permissão Contents: Read and write só no repositório de infra
# (veja docs/aplicacoes/imagem-privada-e-tokens.md no vpn-iac). O job deploy usa `environment: prod`, então o secret pode ficar no ambiente
# "prod" (Settings > Environments) ou no repositório; se ficar no ambiente, o ambiente precisa existir.
# As versões das actions abaixo vêm da memória de quem escreveu; confira se há versões mais novas.
# O build ARM roda sob QEMU (lento); o cache do GitHub Actions acelera as execuções seguintes.
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/api
  MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/api-migrate
  GITOPS_REPO: e-fontana/vpn-iac

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Imagem de migração
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/arm64
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo
      - name: Atualiza as imagens no kustomization
        working-directory: gitops-repo/gitops/manifests/api
        run: >
          kustomize edit set image
          api-image=${IMAGE}:${GITHUB_SHA}
          migrate-image=${MIGRATE_IMAGE}:${GITHUB_SHA}
      - name: Commit e push
        working-directory: gitops-repo
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add gitops/manifests/api/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(api): ${GITHUB_SHA::7}"
          git push
