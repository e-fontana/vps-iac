# SeaweedFS: S3 local da infra (gitops/manifests/seaweedfs). O Loki e o Tempo guardam os dados dele
# no bucket observability-local.
#
# Pré-requisito: os Secrets criados por templates/seaweedfs/create-secrets.sh (veja gitops/README.md),
# ANTES do push: sem eles o SeaweedFS não sobe e o Loki/Tempo ficam sem armazenamento.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  labels:
    group: infra
spec:
  project: infra
  source:
    repoURL: https://github.com/e-fontana/vpn-iac.git
    targetRevision: main
    path: gitops/manifests/seaweedfs
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
