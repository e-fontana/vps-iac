# A API (Deployment + Service + Ingress) e o Postgres dela, em gitops/manifests/api.
# O Kustomize é detectado pelo kustomization.yaml; o CI atualiza a imagem lá.
#
# SEM sync automático de propósito: o deploy só acontece quando você manda (release ou disparo manual
# do CI, depois um Sync aqui). Sem sync, a Application aparece como OutOfSync no ArgoCD. Os Secrets e
# o DNS vêm primeiro (docs/aplicacoes/publicar-a-api.md); então:
#   - clique em Sync na interface, ou
#   - restaure o bloco abaixo (e faça push) para voltar ao sync automático:
#       syncPolicy:
#         automated:
#           prune: true
#           selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  labels:
    group: workloads
spec:
  project: workloads
  source:
    repoURL: https://github.com/e-fontana/vpn-iac.git
    targetRevision: main
    path: gitops/manifests/api
  destination:
    server: https://kubernetes.default.svc
    namespace: api
