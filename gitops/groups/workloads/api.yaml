# A API (Deployment + Service + Ingress) e o Postgres dela, em gitops/manifests/api.
# O Kustomize é detectado pelo kustomization.yaml; o CI atualiza a imagem lá.
#
# SEM sync automático de propósito: a API ainda não existe. A Application aparece como OutOfSync
# no ArgoCD e nada é criado no cluster. Para fazer o deploy, siga a seção "API própria" do
# gitops/README.md (Secrets e DNS primeiro) e então:
#   - clique em Sync na interface, ou
#   - restaure o bloco abaixo (e faça push) para voltar ao sync automático:
#       syncPolicy:
#         automated:
#           prune: true
#           selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  labels:
    group: workloads
spec:
  project: workloads
  source:
    repoURL: https://github.com/e-fontana/vpn-iac.git
    targetRevision: main
    path: gitops/manifests/api
  destination:
    server: https://kubernetes.default.svc
    namespace: api
