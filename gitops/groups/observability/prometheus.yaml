# Prometheus leve para a própria VPS: server + node-exporter + kube-state-metrics.
# Sem Alertmanager nem Pushgateway. Dados em PVC local (local-path do k3s), retenção de 15 dias.
# O Grafana lê de http://prometheus-server.monitoring.svc.cluster.local
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    group: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.39.0
    helm:
      releaseName: prometheus
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          enabled: true
        prometheus-node-exporter:
          enabled: true
        # Coleta o postgres_exporter (sidecar do Postgres da API) por um job próprio chamado "postgres"
        extraScrapeConfigs: |
          - job_name: postgres
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: [postgres]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                regex: postgres-metrics
                action: keep
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
        server:
          # extraFlags substitui o padrão (web.enable-lifecycle): mantém ele e liga o receptor de
          # remote_write, por onde o Alloy entrega as métricas OTLP da API
          extraFlags:
            - web.enable-lifecycle
            - web.enable-remote-write-receiver
          retention: 15d
          persistentVolume:
            enabled: true
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
