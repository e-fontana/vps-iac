# Loki: armazena logs (do Postgres e da API, coletados pelo Alloy). Modo monolítico: 1 pod,
# sem cache e sem gateway, dados em volume local. Retenção de 7 dias.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    group: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: observability
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 20.0.2
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          limits_config:
            retention_period: 168h
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        # O sidecar só carrega regras de alerta de ConfigMaps (não usamos)
        sidecar:
          rules:
            enabled: false
        # Componentes dos modos escalável/distribuído e extras: desligados
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
