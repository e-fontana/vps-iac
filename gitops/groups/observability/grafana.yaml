# Grafana em https://grafana.eduardofontana.dev, com o Prometheus como datasource padrão
# e dois dashboards do grafana.com: Node Exporter Full (1860) e kube-state-metrics v2 (13332).
# Pré-requisito: Secret "grafana-admin" na namespace monitoring (veja gitops/README.md).
# O download dos dashboards roda no start do pod e precisa de acesso a grafana.com.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    group: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability
  source:
    repoURL: https://grafana-community.github.io/helm-charts # o grafana/grafana está deprecated
    chart: grafana
    targetRevision: 14.2.0
    helm:
      releaseName: grafana
      valuesObject:
        # Senha em Secret criado à mão. Sem isso o chart gera uma senha aleatória a cada render,
        # o que o ArgoCD enxergaria como diferença a cada sync.
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        persistence:
          enabled: true
          size: 2Gi
        # O init-chown-data roda com só a capability CHOWN e quebra no 2º start: o Grafana cria
        # csv/ png/ pdf/ no volume e root, sem DAC_READ_SEARCH, não consegue entrar nelas
        # (chown: ...: Permission denied). O volume do local-path já é gravável pelo uid 472.
        initChownData:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        grafana.ini:
          server:
            root_url: https://grafana.eduardofontana.dev
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local
                isDefault: true
              # Nos campos abaixo, "$$" vira "$" (o Grafana expande variáveis de ambiente no provisioning)
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
                jsonData:
                  # Do log para o trace: reconhece trace_id em JSON (logs da API) e o traceparent
                  # do sqlcommenter (logs do Postgres) e abre o trace no Tempo
                  derivedFields:
                    - name: trace_id
                      matcherRegex: '"trace_?[iI][dD]":\s*"(\w+)"'
                      url: "$${__value.raw}"
                      datasourceUid: tempo
                    - name: traceparent
                      matcherRegex: "traceparent='00-(\\w+)-"
                      url: "$${__value.raw}"
                      datasourceUid: tempo
              - name: Tempo
                type: tempo
                uid: tempo
                access: proxy
                url: http://tempo.monitoring.svc.cluster.local:3200
                jsonData:
                  nodeGraph:
                    enabled: true
                  # Do trace para os logs da API e do Postgres (mesma namespace) que citam o trace_id
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: "-5m"
                    spanEndTimeShift: "5m"
                    filterByTraceID: false
                    filterBySpanID: false
                    customQuery: true
                    query: '{namespace="api"} |= "$${__trace.traceId}"'
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 45
              datasource:
                - name: DS_PROMETHEUS
                  value: Prometheus
            kube-state-metrics:
              gnetId: 13332
              revision: 12
              # Este dashboard declara dois inputs; sem VAR_DATASOURCE a variável constante
              # "datasource" fica com o texto literal ${VAR_DATASOURCE} e toda consulta falha.
              datasource:
                - name: DS_PROMETHEUS
                  value: Prometheus
                - name: VAR_DATASOURCE
                  value: Prometheus
            # PostgreSQL Exporter Quickstart (projeto do postgres_exporter): filtra só por
            # instance/datname/job (job=~"postgres.*") e escolhe o datasource sozinho
            postgresql:
              gnetId: 14114
              revision: 1
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
          hosts:
            - grafana.eduardofontana.dev
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.eduardofontana.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
