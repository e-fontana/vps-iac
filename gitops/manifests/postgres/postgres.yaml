# Postgres COMPARTILHADO da infra: uma instância, vários bancos (um banco e um usuário por aplicação).
# 1 réplica, volume local-path do k3s (disco da própria VPS, sem backup automático).
# Só é alcançável dentro do cluster: postgres.postgres.svc.cluster.local:5432.
#
# Superusuário em Secret "postgres-credentials" (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB),
# criado à mão: veja docs/servicos/postgres.md. Para criar o banco de uma aplicação (usuário + banco + Secret
# com DATABASE_URL na namespace dela): templates/postgres/new-database.sh.
#
# Logs: statements lentos (>250 ms) e esperas por lock vão para o stdout; o Alloy os envia ao Loki.
# Métricas: sidecar postgres_exporter (porta 9187), coletado pelo job "postgres" do Prometheus.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Métricas do banco para o Prometheus (job "postgres", em extraScrapeConfigs do prometheus.yaml)
apiVersion: v1
kind: Service
metadata:
  name: postgres-metrics
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          args:
            - -c
            - log_min_duration_statement=250
            - -c
            - log_lock_waits=on
            # %a = application_name; útil para ver de qual serviço veio cada linha
            - -c
            - "log_line_prefix=%m [%p] %u@%d app=%a "
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # subpasta: o volume novo vem com lost+found/permissões que o initdb rejeita na raiz
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATA_SOURCE_URI
              value: localhost:5432/$(POSTGRES_DB)?sslmode=disable
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
