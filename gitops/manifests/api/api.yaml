# A API (NestJS). A imagem é definida no kustomization.yaml (nome lógico "api-image").
# Escuta em 0.0.0.0:8080 (variável PORT) e lê a configuração do ambiente. Os Secrets (na namespace "api") são
# criados pelos scripts em templates/, fora do Git: veja docs/usando-a-infra.md.
#   api-db     DATABASE_URL                                              templates/postgres/new-database.sh
#   api-redis  REDIS_URL, REDIS_USERNAME, REDIS_PASSWORD, REDIS_KEY_PREFIX   templates/redis/new-user.sh
#   api-s3     S3_ENDPOINT, S3_BUCKET, S3_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   templates/seaweedfs/new-bucket.sh
# As migrações do banco rodam antes de cada deploy, no Job migrate-job.yaml (hook PreSync).
# E-mail: o padrão da API é MAIL_PROVIDER=console (os e-mails vão para o log). Para enviar de verdade, defina
# MAIL_PROVIDER=resend e MAIL_FROM aqui e crie um Secret com RESEND_API_KEY.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Imagem privada no GHCR: Secret criado por templates/api/create-pull-secret.sh (fora do Git).
      # Se o Secret ainda não existir, o kubelet avisa e tenta baixar sem credenciais, o que basta
      # para a imagem pública de teste.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: api-image
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WHOAMI_PORT_NUMBER # só a imagem de teste usa; a API real ignora
              value: "8080"
            # OpenTelemetry: a API exporta traces, métricas e logs por OTLP para o Alloy
            - name: OTEL_SERVICE_NAME
              value: api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=prod,k8s.namespace.name=api
          envFrom:
            - secretRef:
                name: api-db
            - secretRef:
                name: api-redis
            - secretRef:
                name: api-s3
          securityContext:
            allowPrivilegeEscalation: false
          # /v1/health: o processo responde. /v1/health/ready: também checa Postgres, Redis e o bucket S3
          # (503 se alguma dependência falhar, e o pod sai do Service). O startupProbe dá até 2 minutos para
          # subir (NestJS + OpenTelemetry num ARM com 50m de CPU) sem o liveness matar o pod.
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          # Medido em repouso (imagem amd64 em Docker): ~155 MiB. O limite deixa folga para picos e para o OpenTelemetry.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
  # Para o Prometheus coletar /metrics da API, descomente (a imagem de teste não tem /metrics):
  # annotations:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "8080"
  #   prometheus.io/path: /metrics
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
