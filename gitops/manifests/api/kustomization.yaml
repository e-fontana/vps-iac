apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api
resources:
- namespace.yaml
- api.yaml
- migrate-job.yaml
- ingress.yaml
  # "api-image" é o nome lógico usado no Deployment. Por enquanto aponta para uma imagem de
  # teste (traefik/whoami) só para validar DNS, TLS e ingress antes de existir código.
  # O CI (templates/api/github-actions.yml) reescreve este bloco a cada deploy com:
  #   kustomize edit set image api-image=ghcr.io/e-fontana/api:<sha> migrate-image=ghcr.io/e-fontana/api-migrate:<sha>
  # "migrate-image" é a imagem do Job de migração (migrate-job.yaml). O placeholder termina na hora, sem migrar nada.
images:
- name: api-image
  newName: ghcr.io/e-fontana/api
  newTag: 93dbfea0838e51755354bd8c916baba2b35b8ede
- name: migrate-image
  newName: ghcr.io/e-fontana/api-migrate
  newTag: 93dbfea0838e51755354bd8c916baba2b35b8ede
