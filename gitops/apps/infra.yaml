# Grupo "infra": serviços compartilhados por várias aplicações (Postgres, armazenamento de objetos).
# Esta Application só aponta para gitops/groups/infra; cada serviço fica lá, um arquivo cada.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  labels:
    group: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: groups
  source:
    repoURL: https://github.com/e-fontana/vpn-iac.git
    targetRevision: main
    path: gitops/groups/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
